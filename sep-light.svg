<line x1="0" y1="30" x2="1200" y2="30" stroke="#8e949a" stroke-width="2"/>
<g><animateTransform attributeName="transform" type="rotate" values="0 600 30;-10 600 30;6 600 30;0 600 30" dur="5s" repeatCount="indefinite"/><line x1="600" y1="30" x2="600" y2="10" stroke="#e07b39" stroke-width="3"/></g>
<circle cx="600" cy="30" r="5" fill="#8e949a"/>
</svg>
